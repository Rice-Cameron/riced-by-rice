# Auto-generated by theme manager: Winter Solitude
$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
    disable_loading_bar = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    animation = fadeIn, 1, 3, easeOutQuint
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/cameronrice/Downloads/kde_wallpaper.jpg
    color = rgba(14171dff)
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# TIME
label {
    monitor =
    text = $TIME12
    color = rgba(88a4c2ff)
    font_size = 90
    font_family = $font
    position = -50, -40
    halign = right
    valign = top
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000cc)
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(d0d7deee)
    font_size = 22
    font_family = $font
    position = -50, -155
    halign = right
    valign = top
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(000000cc)
}

# USER GREETING / ICON
label {
    monitor =
    text =   $USER
    color = rgba(6c8aa8ee)
    font_size = 18
    font_family = $font
    position = 0, 50
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 2
    shadow_color = rgba(000000cc)
}

# INPUT FIELD
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    inner_color = rgba(101318cc)

    outer_color = rgba(88a4c2ee) rgba(6c8aa8ee) 45deg
    check_color = rgba(7a9a88ee) rgba(88a4c2ee) 120deg
    fail_color = rgba(b85866ee) rgba(cf6d7bee) 40deg

    font_color = rgba(d0d7deff)
    fade_on_empty = false
    rounding = 0

    font_family = $font
    placeholder_text = <span foreground="##474f5f">Input password...</span>
    fail_text = <span foreground="##b85866">$FAIL ($ATTEMPTS)</span>

    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(000000cc)

    position = 0, -20
    halign = center
    valign = center
}
