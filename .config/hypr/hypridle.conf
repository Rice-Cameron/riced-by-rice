# Hypridle configuration
# Universal idle manager integrated with system theme & hyprlock

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = hyprctl dispatch dpms on  # to avoid having to press a key twice to turn on the display.
}

# 5 min: dim backlight if supported
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10 2>/dev/null || true
    on-resume = brightnessctl -r 2>/dev/null || true
}

# 9.5 min: warning notification before locking (uses themed mako notification)
listener {
    timeout = 570
    on-timeout = notify-send -u low -t 25000 "Hypridle" "Locking screen in 30 seconds due to inactivity..."
    on-resume = makoctl dismiss 2>/dev/null || true
}

# 10 min: lock screen
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# 15 min: turn off display
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
